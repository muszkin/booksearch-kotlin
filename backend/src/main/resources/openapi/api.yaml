openapi: 3.0.3
info:
  title: BookSearch v2 API
  version: 0.1.0
  description: API for BookSearch v2 - e-book search and library management

paths:
  /api/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Validation error
        '409':
          description: Email already exists

  /api/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /api/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          description: Invalid or expired refresh token

  /api/auth/password-reset-request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestBody'
      responses:
        '200':
          description: Reset email sent if account exists

  /api/auth/password-reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetBody'
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token

  /api/auth/password:
    put:
      operationId: changeOwnPassword
      tags: [auth]
      summary: Change own password (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeOwnPasswordRequest'
      responses:
        '200':
          description: Password changed
        '401':
          description: Not authenticated
        '400':
          description: Invalid current password

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout and revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out

  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or expired access token
        '404':
          description: User no longer exists

  /api/admin/registration:
    put:
      operationId: toggleRegistration
      tags: [admin]
      summary: Enable or disable user registration (super-admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleRegistrationRequest'
      responses:
        '200':
          description: Registration setting updated
        '403':
          description: Not authorized

  /api/admin/description-prompt:
    get:
      operationId: getDescriptionPrompt
      tags: [admin]
      summary: Read the configurable half of the AI description prompt (super-admin)
      responses:
        '200':
          description: Current prompt configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescriptionPromptResponse'
        '403':
          description: Not authorized
    put:
      operationId: setDescriptionPrompt
      tags: [admin]
      summary: Replace the configurable half of the prompt (super-admin)
      description: >
        Sets how books should be described. The rule forbidding invented plots is appended
        by the backend and cannot be edited here, so a style change can never disarm it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescriptionPromptRequest'
      responses:
        '200':
          description: Prompt updated
        '400':
          description: Empty style or negative minimum length
        '403':
          description: Not authorized
    delete:
      operationId: resetDescriptionPrompt
      tags: [admin]
      summary: Restore the built-in prompt and minimum length (super-admin)
      responses:
        '200':
          description: Prompt reset
        '403':
          description: Not authorized

  /api/admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (super-admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of all users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '403':
          description: Not authorized
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a new user (super-admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '403':
          description: Not authorized
        '409':
          description: Email already exists

  /api/search:
    post:
      operationId: submitSearch
      tags: [search]
      summary: Submit an asynchronous book search
      description: >
        Scraping Anna's Archive runs through a headless browser and regularly exceeds
        the 120 second proxy read timeout, so the search is queued and polled instead
        of being answered inline.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: lang
          in: query
          schema:
            type: string
            enum: [pl, en, de, any]
            default: pl
          description: Narrow the search to one language, or "any" to leave it unconstrained
        - name: ext
          in: query
          schema:
            type: string
            enum: [epub, mobi, pdf, any]
            default: epub
          description: Narrow the search to one format, or "any" to leave it unconstrained
        - name: maxPages
          in: query
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 10
          description: Maximum pages to scrape
      responses:
        '202':
          description: Search job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStartedResponse'
        '400':
          description: Missing or invalid query parameters
        '401':
          description: Not authenticated

  /api/search/status/{jobId}:
    get:
      operationId: getSearchStatus
      tags: [search]
      summary: Poll the status and results of a search job
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
          description: Search job identifier
      responses:
        '200':
          description: Current search job state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchJobStatusResponse'
        '401':
          description: Not authenticated
        '404':
          description: Search job not found

  /api/books/{md5}/description:
    get:
      operationId: getBookDescription
      tags: [search]
      summary: Resolve a book description
      description: >
        Returns the publisher blurb Anna's Archive holds for the book. When it has none,
        and an OpenRouter key is configured, a generated description is returned instead;
        the source field says which of the two the text is, so the interface can label
        generated text as such. Answers 404 when neither source has anything.
      security:
        - bearerAuth: []
      parameters:
        - name: md5
          in: path
          required: true
          schema:
            type: string
          description: Book MD5 hash
      responses:
        '200':
          description: Description found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDescriptionResponse'
        '401':
          description: Not authenticated
        '404':
          description: No description available

  /api/books/{md5}/description/regenerate:
    post:
      operationId: regenerateBookDescription
      tags: [search]
      summary: Replace the stored description with a freshly generated one
      description: >
        Used when the publisher blurb is wrong for the book. Generates a description
        through OpenRouter and stores it in place of whatever was there; the archive is
        not consulted. Answers 404 when no key is configured or the model declines, in
        which case the stored text is left untouched.
      security:
        - bearerAuth: []
      parameters:
        - name: md5
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Description regenerated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDescriptionResponse'
        '401':
          description: Not authenticated
        '404':
          description: Could not generate a description

  /api/library:
    get:
      operationId: getUserLibrary
      tags: [library]
      summary: Get user's library (paginated)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated library list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryListResponse'
        '401':
          description: Not authenticated

    post:
      operationId: addToLibrary
      tags: [library]
      summary: Add a book to user's library
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToLibraryRequest'
      responses:
        '201':
          description: Book added to library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryBook'
        '404':
          description: Book not found
        '409':
          description: Book already in library with this format

  /api/library/{id}:
    delete:
      operationId: removeFromLibrary
      tags: [library]
      summary: Remove a book from user's library
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Entry removed
        '404':
          description: Entry not found

  /api/library/covers/backfill:
    post:
      operationId: backfillLibraryCovers
      tags: [library]
      summary: Re-extract cover images from already downloaded EPUB files
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Backfill summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverBackfillResult'
        '401':
          description: Not authenticated

  /api/library/{id}/cover:
    get:
      operationId: getLibraryCover
      tags: [library]
      summary: Stream extracted EPUB cover image for a library entry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cover image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated
        '404':
          description: Cover not available for this entry

  /api/library/batch-download:
    post:
      operationId: batchDownload
      tags: [library]
      summary: Download multiple library books as a ZIP archive
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDownloadRequest'
      responses:
        '200':
          description: ZIP file stream
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated
        '422':
          description: Empty ID list

  /api/library/check:
    get:
      operationId: checkOwnership
      tags: [library]
      summary: Check ownership for given book MD5s
      security:
        - bearerAuth: []
      parameters:
        - name: md5
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated list of book MD5 hashes
      responses:
        '200':
          description: Ownership info per MD5
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/OwnershipInfo'
        '401':
          description: Not authenticated

  /api/convert/{libraryId}:
    post:
      operationId: startConversion
      tags: [convert]
      summary: Start format conversion for a library book
      security:
        - bearerAuth: []
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
        - name: target
          in: query
          required: true
          schema:
            type: string
            enum: [epub, mobi, pdf]
          description: Target format for conversion
      responses:
        '202':
          description: Conversion queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionStartedResponse'
        '401':
          description: Not authenticated
        '404':
          description: Library entry not found
        '422':
          description: Validation error (same format, unsupported format)

  /api/convert/status/{jobId}:
    get:
      operationId: getConversionStatus
      tags: [convert]
      summary: Get conversion job status
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionStatusResponse'
        '401':
          description: Not authenticated
        '404':
          description: Conversion job not found

  /api/deliver/{libraryId}:
    post:
      operationId: deliverBook
      tags: [deliver]
      summary: Deliver a library book to a device via email
      security:
        - bearerAuth: []
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
        - name: device
          in: query
          required: true
          schema:
            type: string
            enum: [kindle, pocketbook]
          description: Target device for delivery
      responses:
        '200':
          description: Delivery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '401':
          description: Not authenticated
        '404':
          description: Library entry not found
        '422':
          description: SMTP not configured for device

  /api/deliveries:
    get:
      operationId: getUserDeliveries
      tags: [deliver]
      summary: Get all deliveries for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryRecord'
        '401':
          description: Not authenticated

  /api/deliveries/{bookMd5}:
    get:
      operationId: getDeliveriesForBook
      tags: [deliver]
      summary: Get deliveries for a specific book
      security:
        - bearerAuth: []
      parameters:
        - name: bookMd5
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deliveries for this book
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryRecord'
        '401':
          description: Not authenticated

  /api/settings:
    get:
      operationId: getAllSettings
      tags: [settings]
      summary: Get all device settings for authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All device settings (passwords redacted)
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/DeviceSettingsResponse'
        '401':
          description: Not authenticated

  /api/settings/{device}:
    get:
      operationId: getDeviceSettings
      tags: [settings]
      summary: Get SMTP settings for a specific device
      security:
        - bearerAuth: []
      parameters:
        - name: device
          in: path
          required: true
          schema:
            type: string
            enum: [kindle, pocketbook]
      responses:
        '200':
          description: Device settings (password redacted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSettingsResponse'
        '401':
          description: Not authenticated
        '404':
          description: Settings not found for device
        '422':
          description: Invalid device name
    put:
      operationId: saveDeviceSettings
      tags: [settings]
      summary: Save SMTP settings for a specific device
      security:
        - bearerAuth: []
      parameters:
        - name: device
          in: path
          required: true
          schema:
            type: string
            enum: [kindle, pocketbook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceSettingsRequest'
      responses:
        '200':
          description: Settings saved
        '401':
          description: Not authenticated
        '422':
          description: Invalid device name
    delete:
      operationId: deleteDeviceSettings
      tags: [settings]
      summary: Delete SMTP settings for a specific device
      security:
        - bearerAuth: []
      parameters:
        - name: device
          in: path
          required: true
          schema:
            type: string
            enum: [kindle, pocketbook]
      responses:
        '200':
          description: Settings deleted
        '401':
          description: Not authenticated
        '422':
          description: Invalid device name

  /api/auth/registration-status:
    get:
      operationId: getRegistrationStatus
      tags: [auth]
      summary: Check if user registration is enabled (public)
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'

  /api/download/jobs:
    get:
      operationId: getDownloadJobs
      tags: [download]
      summary: Get paginated list of download jobs for authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Filter by job status
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated download job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJobListResponse'
        '401':
          description: Not authenticated

  /api/download/{jobId}/cancel:
    patch:
      operationId: cancelDownloadJob
      tags: [download]
      summary: Cancel a queued or active download job
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelJobResponse'
        '401':
          description: Not authenticated
        '404':
          description: Job not found or not owned by user
        '422':
          description: Job cannot be cancelled (not in cancellable state)

  /api/download/{md5}:
    post:
      operationId: startDownload
      tags: [download]
      summary: Start downloading a book by MD5
      security:
        - bearerAuth: []
      parameters:
        - name: md5
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Download queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadStartedResponse'
        '401':
          description: Not authenticated
        '404':
          description: Book not found

  /api/download/status/{jobId}:
    get:
      operationId: getDownloadStatus
      tags: [download]
      summary: Get download job status
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Download job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadStatusResponse'
        '401':
          description: Not authenticated
        '404':
          description: Download job not found

  /api/logs/activity:
    get:
      operationId: getActivityLogs
      tags: [logs]
      summary: Get activity logs for authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: type
          in: query
          schema:
            type: string
          description: Filter by action type
      responses:
        '200':
          description: Paginated activity log list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogListResponse'
        '401':
          description: Not authenticated

  /api/logs/requests:
    get:
      operationId: getRequestLogs
      tags: [logs]
      summary: Get request logs (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: method
          in: query
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
        - name: statusCode
          in: query
          schema:
            type: integer
        - name: from
          in: query
          schema:
            type: string
          description: ISO-8601 date-time filter (from)
        - name: to
          in: query
          schema:
            type: string
          description: ISO-8601 date-time filter (to)
      responses:
        '200':
          description: Paginated request log list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogListResponse'
        '401':
          description: Not authenticated
        '403':
          description: Not authorized (admin only)

  /api/admin/users/{id}/password:
    put:
      operationId: changeUserPassword
      tags: [admin]
      summary: Change a user's password (super-admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
        '403':
          description: Not authorized
        '404':
          description: User not found

  /api/admin/users/{id}/impersonate:
    post:
      operationId: impersonateUser
      tags: [admin]
      summary: Start impersonating a user (super-admin only)
      description: |
        Admin impersonation start; SUPER_ADMIN only. Returns tokens + UserResponse with actAs* populated.
        The returned tokens grant an impersonation session (access TTL 30 min, refresh TTL 1 h,
        non-sliding absolute cap). Rejected if target is self, another super admin, or inactive.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Impersonation session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Not authenticated
        '403':
          description: Not authorized (not super-admin, or target is super-admin)
        '404':
          description: Target user not found
        '422':
          description: Invalid target (self, or inactive)

  /api/admin/impersonate/stop:
    post:
      operationId: stopImpersonation
      tags: [admin]
      summary: Return to admin identity (end impersonation)
      description: |
        End impersonation session, restore admin identity with fresh tokens.
        Revokes the impersonation refresh token and mints a fresh admin access + refresh pair
        (standard TTL). Gated by the presence of original_admin_id JWT claim on the current
        access token. Failing for a non-impersonated session returns 403.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: Current impersonation refresh token to revoke.
      responses:
        '200':
          description: Admin identity restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Not authenticated or refresh token invalid
        '403':
          description: Current session is not an impersonation session
        '404':
          description: Admin user not found

  /api/translation/models:
    get:
      operationId: listTranslationModels
      tags: [translation]
      summary: List currently free text models
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationModel'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request, missing confirmation, unavailable configuration, or ineligible source or model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/translation/{libraryId}/estimate:
    get:
      operationId: estimateTranslation
      tags: [translation]
      summary: Estimate translation of an owned downloaded English EPUB
      security:
        - bearerAuth: []
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: modelId
          in: query
          required: false
          description: Explicit free model instead of the administrator default
          schema: { type: string }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationEstimateResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request, missing confirmation, unavailable configuration, or ineligible source or model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/translation/{libraryId}:
    post:
      operationId: startTranslation
      tags: [translation]
      summary: Confirm external processing and queue a translation
      security:
        - bearerAuth: []
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationStartRequest'
      responses:
        '202':
          description: Translation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationStartedResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active translation already exists or the job state does not allow this operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request, missing confirmation, unavailable configuration, or ineligible source or model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/translation/{libraryId}/context-preview:
    post:
      operationId: previewTranslationContext
      tags: [Translation]
      summary: Preview stable reference samples before external processing
      security:
        - bearerAuth: []
      parameters:
        - name: libraryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranslationOptions' }
      responses:
        '200':
          description: Options with server-generated referenceText; nothing sent to a model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranslationOptions' }
        '422':
          description: Invalid reference context

  /api/translation/{libraryId}/references/{md5}/download:
    post:
      operationId: downloadTranslationReference
      tags: [Translation]
      summary: Download an indexed Polish EPUB by the source author without device delivery
      security:
        - bearerAuth: []
      parameters:
        - name: libraryId
          in: path
          required: true
          schema: { type: integer }
        - name: md5
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Download queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadStartedResponse'
        '404':
          description: Source not owned or reference not indexed
        '422':
          description: Reference is not a Polish EPUB by the same author

  /api/translation/{libraryId}/references:
    get:
      operationId: listTranslationReferences
      tags: [translation]
      security: [{bearerAuth: []}]
      parameters:
        - {name: libraryId, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Owned Polish EPUBs by the same author
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LibraryBook'}
        '404': {description: Source not owned or not found}
        '401': {description: Authentication required}

  /api/translation/jobs/{jobId}/details:
    get:
      operationId: getTranslationDetails
      tags: [translation]
      security: [{bearerAuth: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Owner-only persisted context, chapter progress and attempt history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TranslationDetails'}
        '404': {description: Job not owned or not found}
        '401': {description: Authentication required}

  /api/translation/jobs/{jobId}/chapters/{index}/export:
    get:
      operationId: exportTranslationChapter
      tags: [translation]
      security: [{bearerAuth: []}]
      parameters:
        - {name: jobId, in: path, required: true, schema: {type: string}}
        - {name: index, in: path, required: true, schema: {type: integer, minimum: 0}}
        - {name: format, in: query, schema: {type: string, enum: [txt, md], default: txt}}
      responses:
        '200':
          description: Translated chapter; incomplete chapters are clearly marked
          content:
            text/plain:
              schema: {type: string}
        '422': {description: No translated text or invalid format}
        '404': {description: Chapter or owned job not found}
        '401': {description: Authentication required}

  /api/translation/jobs:
    get:
      operationId: listTranslationJobs
      tags: [translation]
      summary: Rediscover owned active, paused, and completed translations
      description: Returns active and resumable jobs plus completed translations so chapter exports remain accessible after reloading. Failed and cancelled jobs are omitted.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Owned active, paused, or completed jobs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TranslationStatusResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/translation/jobs/{jobId}:
    get:
      operationId: getTranslationStatus
      tags: [translation]
      summary: Get an owned translation job
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationStatusResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/translation/jobs/{jobId}/resume:
    post:
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TranslationOptions'}
      operationId: resumeTranslation
      tags: [translation]
      summary: Resume a paused translation after revalidating its source and model
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Translation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationStartedResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active translation already exists or the job state does not allow this operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request, missing confirmation, unavailable configuration, or ineligible source or model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/translation/jobs/{jobId}/cancel:
    post:
      operationId: cancelTranslation
      tags: [translation]
      summary: Cancel queued or paused work and remove its private workspace
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Translation cancelled
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found or not owned by the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An active translation already exists or the job state does not allow this operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/translation/config:
    get:
      operationId: getTranslationConfig
      tags: [admin]
      summary: Get saved model and live eligibility without credentials
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationConfigResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Super-admin required; impersonated sessions denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      operationId: updateTranslationConfig
      tags: [admin]
      summary: Save a currently free text model as default
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationConfigRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationConfigResponse'
        '401':
          description: Missing or invalid JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Super-admin required; impersonated sessions denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid request, missing confirmation, unavailable configuration, or ineligible source or model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: integer
        message:
          type: string

    TranslationModel:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    TranslationStartRequest:
      type: object
      required: [externalProcessingConfirmed]
      properties:
        options:
          $ref: '#/components/schemas/TranslationOptions'
        externalProcessingConfirmed:
          type: boolean
          description: Must be explicitly true to permit sending EPUB text to OpenRouter.

    TranslationOptions:
      type: object
      properties:
        modelId: {type: string, nullable: true}
        autoFallback: {type: boolean, default: true}
        fallbackModelIds:
          type: array
          maxItems: 10
          items: {type: string}
        referenceLibraryIds:
          type: array
          maxItems: 5
          items: {type: integer}
        referenceChapters: {type: integer, minimum: 1, maximum: 5, default: 3}
        glossary: {type: string, maxLength: 12000}
        notes: {type: string, maxLength: 4000}
        referenceText: {type: string, readOnly: true, description: Persisted sampled excerpts; ignored in requests}

    TranslationAttempt:
      type: object
      required: [id, startedAt, chapterIndex, segmentIndex, requestedModel, status, inputTokens, outputTokens, itemCount]
      properties:
        id: {type: string}
        startedAt: {type: string}
        chapterIndex: {type: integer}
        segmentIndex: {type: integer}
        requestedModel: {type: string}
        actualModel: {type: string, nullable: true}
        status: {type: string}
        errorCode: {type: string, nullable: true}
        message: {type: string, nullable: true}
        inputTokens: {type: integer}
        outputTokens: {type: integer}
        itemCount: {type: integer}
        finishReason: {type: string, nullable: true}
        retryAt: {type: string, nullable: true, description: UTC instant when retry becomes eligible.}
        rateLimitScope: {type: string, nullable: true, enum: [platform, provider, unknown]}
        rateLimitLimit: {type: integer, format: int64, nullable: true}
        rateLimitRemaining: {type: integer, format: int64, nullable: true}

    TranslationChapterDetail:
      type: object
      required: [index, href, status, attempts, translatedSegments, totalSegments]
      properties:
        index: {type: integer}
        href: {type: string}
        status: {type: string}
        attempts: {type: integer}
        error: {type: string, nullable: true}
        translatedSegments: {type: integer}
        totalSegments: {type: integer}

    TranslationDetails:
      type: object
      required: [options, chapters, attempts]
      properties:
        options: {$ref: '#/components/schemas/TranslationOptions'}
        chapters:
          type: array
          items: {$ref: '#/components/schemas/TranslationChapterDetail'}
        attempts:
          type: array
          items: {$ref: '#/components/schemas/TranslationAttempt'}

    TranslationJobState:
      type: string
      enum: [queued, running, paused, completed, failed, cancelled]

    TranslationStartedResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
          description: UUID identifying the translation job.
        status:
          $ref: '#/components/schemas/TranslationJobState'

    TranslationEstimateResponse:
      type: object
      required: [totalChapters, estimatedInputTokens, modelId, indicativeDuration, limitWarning]
      properties:
        totalChapters:
          type: integer
        estimatedInputTokens:
          type: integer
        modelId:
          type: string
        indicativeDuration:
          type: string
          description: Indicative duration category, currently minutes_to_hours.
        limitWarning:
          type: string

    TranslationStatusResponse:
      type: object
      required: [jobId, status, sourceLibraryEntryId, modelId, totalChapters, completedChapters, estimatedInputTokens, actualInputTokens, actualOutputTokens, resumable]
      properties:
        retryAt: {type: string, nullable: true, description: Active shared cooldown deadline in UTC.}
        rateLimitScope: {type: string, nullable: true, enum: [platform, provider, unknown]}
        jobId:
          type: string
          description: UUID identifying the translation job.
        status:
          $ref: '#/components/schemas/TranslationJobState'
        sourceLibraryEntryId:
          type: integer
        modelId:
          type: string
        totalChapters:
          type: integer
        completedChapters:
          type: integer
        failedChapterIndex:
          type: integer
          nullable: true
        estimatedInputTokens:
          type: integer
        actualInputTokens:
          type: integer
        actualOutputTokens:
          type: integer
        outputLibraryEntryId:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
          description: Safe error code; never source text or an upstream response.
        resumable:
          type: boolean

    TranslationConfigRequest:
      type: object
      required: [defaultModelId]
      properties:
        defaultModelId:
          type: string
          minLength: 1

    TranslationConfigResponse:
      type: object
      required: [defaultModelId, configured, eligible]
      properties:
        defaultModelId:
          type: string
          nullable: true
        configured:
          type: boolean
          description: Whether server credentials and a default model are configured.
        eligible:
          type: boolean
          nullable: true
          description: Live free-text eligibility; null when the model list could not be checked.

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    PasswordResetRequestBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetBody:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    ChangeOwnPasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 8
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ToggleRegistrationRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean

    CreateUserRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
        displayName:
          type: string
          minLength: 1
          maxLength: 100

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
        sendLoginLink:
          type: boolean
          default: false

    SearchResponse:
      type: object
      required: [results, totalResults, query]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookResult'
        totalResults:
          type: integer
        query:
          type: string

    DescriptionPromptResponse:
      type: object
      required: [style, minLength, isDefault, guard]
      properties:
        style:
          type: string
          description: The editable half — how a book should be described
        minLength:
          type: integer
          description: Answers shorter than this are discarded as unreliable
        isDefault:
          type: boolean
        guard:
          type: string
          description: Read-only; always appended, forbids invented plots

    DescriptionPromptRequest:
      type: object
      required: [style, minLength]
      properties:
        style:
          type: string
        minLength:
          type: integer

    BookDescriptionResponse:
      type: object
      required: [description, source]
      properties:
        description:
          type: string
        source:
          type: string
          enum: [annas-archive, openrouter]
          description: Where the text came from; "openrouter" means it was generated
        isbn:
          type: string
          nullable: true
        canRegenerate:
          type: boolean
          description: False when no OpenRouter key is configured

    SearchStartedResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: integer
        status:
          type: string

    SearchJobStatusResponse:
      type: object
      required: [jobId, query, status, results, totalResults]
      properties:
        jobId:
          type: integer
        query:
          type: string
        status:
          type: string
          enum: [queued, scraping, completed, failed]
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookResult'
        totalResults:
          type: integer
        error:
          type: string
          nullable: true

    BookResult:
      type: object
      required: [md5, title, author, language, format, fileSize, detailUrl, coverUrl, publisher, year, description, matchType, ownedFormats]
      properties:
        md5:
          type: string
        title:
          type: string
        author:
          type: string
        language:
          type: string
        format:
          type: string
        fileSize:
          type: string
        detailUrl:
          type: string
        coverUrl:
          type: string
        publisher:
          type: string
        year:
          type: string
        description:
          type: string
        matchType:
          type: string
          enum: [exact, title, author, none]
        ownedFormats:
          type: array
          items:
            type: string

    OwnershipInfo:
      type: object
      required: [matchType, ownedFormats]
      properties:
        matchType:
          type: string
          enum: [exact, title, author, none]
        ownedFormats:
          type: array
          items:
            type: string

    CoverBackfillResult:
      type: object
      required: [extracted, alreadyPresent, skippedNoFile, skippedNotEpub, failed]
      properties:
        extracted:
          type: integer
        alreadyPresent:
          type: integer
        skippedNoFile:
          type: integer
        skippedNotEpub:
          type: integer
        failed:
          type: integer

    AddToLibraryRequest:
      type: object
      required: [bookMd5, format]
      properties:
        bookMd5:
          type: string
        format:
          type: string

    LibraryBook:
      type: object
      required: [id, bookMd5, format, addedAt, title, author, language, fileSize, detailUrl, coverUrl, publisher, year, description, descriptionSource]
      properties:
        id:
          type: integer
        bookMd5:
          type: string
        format:
          type: string
        filePath:
          type: string
          nullable: true
        addedAt:
          type: string
        title:
          type: string
        author:
          type: string
        language:
          type: string
        fileSize:
          type: string
        detailUrl:
          type: string
        coverUrl:
          type: string
        publisher:
          type: string
        year:
          type: string
        description:
          type: string
        descriptionSource:
          type: string
          description: Empty when no description is stored; otherwise annas-archive or openrouter.

    LibraryListResponse:
      type: object
      required: [items, totalItems, page, pageSize, totalPages, canRegenerate]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryBook'
        totalItems:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        canRegenerate:
          type: boolean
          description: False when no OpenRouter key is configured, so the interface can hide the generate controls.

    ConversionStartedResponse:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string

    ConversionStatusResponse:
      type: object
      required: [jobId, status, sourceFormat, targetFormat]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [queued, converting, completed, failed]
        sourceFormat:
          type: string
        targetFormat:
          type: string
        error:
          type: string
          nullable: true

    DeliveryResponse:
      type: object
      required: [deliveryId, status]
      properties:
        deliveryId:
          type: integer
        status:
          type: string
          enum: [sent, failed]
        error:
          type: string
          nullable: true

    DeliveryRecord:
      type: object
      required: [id, userId, bookMd5, deviceType, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        bookMd5:
          type: string
        deviceType:
          type: string
        status:
          type: string
        sentAt:
          type: string
