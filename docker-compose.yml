# BookSearch v2 — Production Docker Compose
#
# Usage:
#   cp .env.example .env   # configure environment variables
#   docker compose up -d   # start all services
#
# Services:
#   backend       — Kotlin/Ktor application serving API + SPA (port 8080)
#   flaresolverr  — headless browser proxy for Cloudflare bypass (port 8191)
#   autoheal      — restarts FlareSolverr when its health check fails
#   mailpit       — development SMTP server + web UI (ports 1025, 8025)

services:
  # Main application — backend API + embedded Vue.js frontend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/muszkin/booksearch-kotlin:latest
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      MIRROR_DOMAINS: annas-archive.gd,annas-archive.pk,annas-archive.gl
    volumes:
      - booksearch-data:/app/data
    depends_on:
      flaresolverr:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # All app output already goes to stdout via the Logback ConsoleAppender
    # in application.yaml. This block keeps logs shippable (json-file driver
    # with rotation) and labels the container so a shared Promtail/Loki
    # stack can pick it up via docker_sd_configs.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      logging.stack: booksearch
      logging.job: booksearch-backend

  # FlareSolverr — proxies requests through a headless browser to bypass
  # Cloudflare challenges. Required for all Anna's Archive interactions.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -X POST http://localhost:8191/v1
          -H 'Content-Type: application/json'
          --data '{"cmd":"request.get","url":"https://www.google.com","maxTimeout":30000}'
          | grep -q '"status":"ok"'
      interval: 30m
      timeout: 45s
      retries: 2
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging.stack: booksearch
      logging.job: booksearch-flaresolverr
      booksearch.autoheal: "true"

  # Docker restart policies react to process exits, not to an unhealthy
  # healthcheck. Autoheal watches only explicitly labelled containers.
  autoheal:
    image: willfarrell/autoheal:1.1.0
    environment:
      AUTOHEAL_CONTAINER_LABEL: booksearch.autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
      AUTOHEAL_ONLY_MONITOR_RUNNING: "true"
    network_mode: none
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      logging.stack: booksearch
      logging.job: booksearch-autoheal

  # Mailpit — local SMTP catch-all for development.
  # In production replace with a real SMTP server and remove this service.
  # Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      logging.stack: booksearch
      logging.job: booksearch-mailpit

volumes:
  booksearch-data:
    driver: local
